<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <title>RoadMaster Pro | Engineering OS</title>
    
    <!-- Performance: Preconnect to critical third-party origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.vercel.com">
    <link rel="preconnect" href="https://api.supabase.co">
    
    <!-- Performance: DNS prefetch for less critical resources -->
    <link rel="dns-prefetch" href="https://*.supabase.co">
    
    <!-- Performance: Preload critical fonts (display=swap ensures text is visible immediately) -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"></noscript>
    
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var message = [
          'Message: ' + msg,
          'URL: ' + url,
          'Line: ' + lineNo,
          'Column: ' + columnNo,
          'Error object: ' + JSON.stringify(error)
        ].join(' - ');
        console.error("GLOBAL ERROR CAPTURED:", message);
        
        // Show error on screen for debugging
        var div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.background = 'red';
        div.style.color = 'white';
        div.style.padding = '10px';
        div.style.zIndex = '99999';
        div.style.fontSize = '12px';
        div.innerText = 'SYSTEM CRASH: ' + msg + ' (Line ' + lineNo + ')';
        document.body.appendChild(div);
        return false;
      };

      // Also catch unhandled promise rejections
      window.onunhandledrejection = function(event) {
        console.error("UNHANDLED REJECTION:", event.reason);
        var div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.bottom = '0';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.background = 'orange';
        div.style.color = 'black';
        div.style.padding = '10px';
        div.style.zIndex = '99999';
        div.style.fontSize = '10px';
        div.innerText = 'PROMISE ERROR: ' + (event.reason ? event.reason.message : 'Unknown');
        document.body.appendChild(div);
      };
    </script>
    
    


        <link rel="stylesheet" href="/inline-styles.css">
    </head>
      <body class="font-sans antialiased">
        <div class="desktop-titlebar">

           <div id="desktop-clock" class="w-28 text-right font-mono opacity-100">00:00:00</div>
        </div>    <div id="root"></div>

          if (el) el.innerText = new Date().toLocaleTimeString('en-US', { hour12: false });
       }, 1000);
